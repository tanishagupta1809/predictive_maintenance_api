<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Predictive Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #121826;
            color: white;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #00c853;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            background: #1f2937;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            margin-top: 10px;
            background: #1f2937;
            border-radius: 10px;
        }

        td {
            padding: 8px;
        }
    </style>
</head>

<body>

<h2>Predictive Maintenance Dashboard</h2>

<div class="container">

<form action="/predict" method="post">
    <input name="airTemp" placeholder="Air Temperature">
    <input name="processTemp" placeholder="Process Temperature">
    <input name="speed" placeholder="Speed">
    <input name="torque" placeholder="Torque">
    <input name="toolWear" placeholder="Tool Wear">

    <select name="type">
        <option value="L">Low</option>
        <option value="M">Medium</option>
        <option value="H">High</option>
    </select>

    <button type="submit">Predict</button>
</form>

<!-- RESULT -->
<div class="card" th:if="${result}">
    <h3>Prediction Result</h3>
    <p th:text="${result}"></p>
</div>

<!-- GRAPH -->
<div class="card">
    <h3>Confidence Trend</h3>
    <canvas id="chart"></canvas>
</div>

<!-- HISTORY -->
<div class="card">
    <h3>Prediction History</h3>
    <table>
        <tr th:each="h : ${history}">
            <td th:text="${h}"></td>
        </tr>
    </table>
</div>

</div>

<script>
    let data = [[${confData}]];

    const ctx = document.getElementById('chart');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.map((_, i) => i+1),
            datasets: [{
                label: 'Confidence',
                data: data
            }]
        }
    });
</script>

</body>
</html>
